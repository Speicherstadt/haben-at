{{- with .Values.metrics.serviceMonitor }}
{{- if .enabled }}
{{- if and (not $.Values.app.existingSecret) (not $.Values.app.secretEnv.HABEN_METRICS_TOKEN) }}
{{- fail "metrics.serviceMonitor braucht app.secretEnv.HABEN_METRICS_TOKEN: ohne Token gibt es /api/metrics nicht" }}
{{- end }}
# Fragt /api/metrics mit dem Token aus dem Secret der App ab (https://haben.app/installation-ueberwachung.html). Mit
# app.existingSecret muss es dort den Schlüssel HABEN_METRICS_TOKEN geben.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "haben.fullname" $ }}
  labels:
    {{- include "haben.labels" $ | nindent 4 }}
    app.kubernetes.io/component: app
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "haben.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: app
  endpoints:
    - port: http
      path: /api/metrics
      {{- with .interval }}
      interval: {{ include "haben.text" (list "metrics.serviceMonitor.interval" .) }}{{ . }}
      {{- end }}
      {{- with .scrapeTimeout }}
      scrapeTimeout: {{ include "haben.text" (list "metrics.serviceMonitor.scrapeTimeout" .) }}{{ . }}
      {{- end }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "haben.appSecret" $ }}
          key: HABEN_METRICS_TOKEN
{{- end }}
{{- end }}
