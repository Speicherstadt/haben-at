{{- with .Values.metrics.prometheusRule }}
{{- if .enabled }}
# Dieselben Regeln wie files/prometheus-regeln.yml, die es auch ohne Kubernetes gibt (https://haben.app/installation-ueberwachung.html).
# Sie gelten für alle Reihen mit diesen Namen; bei mehreren Installationen im Cluster nur bei einer einschalten.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "haben.fullname" $ }}
  labels:
    {{- include "haben.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $.Files.Get "files/prometheus-regeln.yml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
{{- end }}
